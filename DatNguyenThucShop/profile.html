<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
<title>Tài Khoản Của Tôi | DatNguyenThucShop</title>
    <meta
      name="description"
      content="Quản lý thông tin tài khoản, đơn hàng và sản phẩm yêu thích tại DatNguyenThucShop."
    />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/bo-cuc.css" />
  </head>
  <body>
    <!-- TOP ANNOUNCEMENT BAR -->
    <iframe src="header.html" title="Phan dau trang" style="display:block;position:sticky;top:0;z-index:1000;width:100%;height:80px;border:0;overflow:hidden;background:#fff"></iframe>

    <nav class="thanh-duong-dan" aria-label="Điều hướng đường dẫn">
      <a href="index.html">Trang chủ</a>
      <span class="dau-phan-cach" aria-hidden="true">›</span>
      <span class="duong-dan-hien-tai" aria-current="page">Tài khoản của tôi</span>
    </nav>
    <main class="khung-noi-dung">
      <!-- Rendered dynamically by auth.js -->
      <div id="profilePageContainer">
        <div
          style="
            padding: 60px 0;
            text-align: center;
            color: var(--color-text-muted);
          "
        >
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
          <div style="margin-top: 12px">Đang tải thông tin tài khoản...</div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <iframe src="footer.html" title="Phan chan trang" style="display:block;width:100%;height:390px;border:0;overflow:hidden"></iframe>

    <!-- SCRIPTS -->
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
